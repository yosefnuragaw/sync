# persona-1 on Llama-3.1-8B, supervised vectors: averaged into one direction and
# injected at a single layer.
#
#   python generate_answers.py --config bipo/configs/persona-1/llama3_1/15-billy-ref.yaml

id: "llama3-1-8b-bipo-15-billy-ref"
model_name_or_path: "meta-llama/Llama-3.1-8B-Instruct"
behavior: "persona-1"
total_layer: 32
layer: [15]
vec_dir: ["bipo/vector/power-seeking/llama-3/all", "bipo/vector/wealth-seeking/llama-3/all", "bipo/vector/corrigible-less/llama-3/all", "bipo/vector/coordinate-other/llama-3/all"]
answer_dir: "bipo/generation_results/persona-1/llama-3/15-billy-ref"
apply_type: "billy"

# 'reference' keeps the direction and takes ref_vec_dir's per-layer norm.
vec_scale: "reference"
ref_vec_dir: ["billy/vector/power-seeking/llama-3/all", "billy/vector/wealth-seeking/llama-3/all", "billy/vector/corrigible-less/llama-3/all", "billy/vector/coordinate-other/llama-3/all"]
multipliers: [-1.5, -1.0, -0.5, 0.5, 1.0, 1.5]
